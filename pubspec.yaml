name: gym_tracker
description: A workout tracking app with unlimited history, advanced statistics, and progress tracking.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Local database
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.3

  # State management
  provider: ^6.1.2

  # Utilities
  uuid: ^4.4.0
  intl: ^0.19.0
  table_calendar: ^3.1.2
  fl_chart: ^0.68.0
  image_picker: ^1.1.2
  shared_preferences: ^2.3.2
  share_plus: ^10.0.2
  file_picker: ^8.1.2
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
